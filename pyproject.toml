[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "musicdl"
version = "1.1.0"
description = "Personal CLI: download music by metadata (TuneMyMusic CSV / Spotify links) using spotDL"
requires-python = ">=3.10,<3.15"
dependencies = [
    # 4.5.0+ includes spotDL PR #2626 (keyless Spotify client after the Feb 2026 API changes,
    # issue #2617); 4.5.2 is the latest release with follow-up fixes.
    "spotdl==4.5.2",
    "python-dotenv>=1.0,<2",
    # Windows 11 style theme for the window (MIT); the window falls back to
    # the built-in theme if it is missing.
    "sv-ttk>=2.6,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
musicdl = "musicdl.cli:main"

[project.gui-scripts]
musicdl-gui = "musicdl.gui:main"

[tool.setuptools]
packages = ["musicdl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
